<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradado para el fondo -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0808" />
      <stop offset="100%" stop-color="#120303" />
    </radialGradient>
    
    <!-- Degradado para el queso -->
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD15C" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>

    <!-- Degradado para la orilla/corteza -->
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E58E26" />
      <stop offset="100%" stop-color="#B25900" />
    </linearGradient>

    <!-- Sombra suave -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Círculo base con borde dorado -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)" stroke="#FFB703" stroke-width="12" />
  <circle cx="256" cy="256" r="228" fill="none" stroke="#D00000" stroke-width="4" opacity="0.6" />

  <!-- Grupo Pizzeria / Rebanada centrada -->
  <g filter="url(#dropShadow)" transform="translate(10, 5)">
    <!-- Orilla de la pizza (Corteza) -->
    <path d="M 140 150 C 230 100 330 120 380 180 C 390 192 380 205 365 200 C 320 160 230 145 155 180 C 142 186 130 162 140 150 Z" fill="url(#crustGrad)"/>

    <!-- Cuerpo de la pizza (Salsa/Queso) -->
    <path d="M 158 175 C 230 145 320 160 362 195 L 246 380 Z" fill="#D00000" />
    <path d="M 163 182 C 230 152 315 167 355 200 L 246 370 Z" fill="url(#cheeseGrad)" />

    <!-- Queso derretido cayendo de la punta -->
    <path d="M 236 355 Q 240 390 246 392 Q 252 390 256 355 Z" fill="#FFD15C" />

    <!-- Peperonis -->
    <circle cx="220" cy="220" r="22" fill="#9E0000" />
    <circle cx="220" cy="220" r="18" fill="#C1121F" />
    <circle cx="215" cy="215" r="4" fill="#E63946" opacity="0.7"/>

    <circle cx="285" cy="235" r="25" fill="#9E0000" />
    <circle cx="285" cy="235" r="20" fill="#C1121F" />
    <circle cx="280" cy="230" r="5" fill="#E63946" opacity="0.7"/>

    <circle cx="248" cy="295" r="20" fill="#9E0000" />
    <circle cx="248" cy="295" r="16" fill="#C1121F" />
    <circle cx="244" cy="291" r="3" fill="#E63946" opacity="0.7"/>

    <!-- Detalles de destellos/brillo en el queso -->
    <ellipse cx="190" cy="200" rx="12" ry="5" fill="#FFF" opacity="0.3" transform="rotate(-20 190 200)" />
  </g>
</svg>
